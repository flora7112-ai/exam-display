<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>期末考看板系統 - 8:40起跑版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        body { font-family: "Microsoft JhengHei", sans-serif; overflow: hidden; background-color: #f3f4f6; }
        .track-transition { transition: stroke-dashoffset 1s linear, stroke 0.5s ease; }
        .bg-stripes {
            background-image: linear-gradient(45deg, #fbbf24 25%, transparent 25%, transparent 50%, #fbbf24 50%, #fbbf24 75%, transparent 75%, transparent);
            background-size: 20px 20px;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- 核心設定：考試與休息時段 ---
        const SCHEDULE = [
            { type: 'exam',  start: '08:40', end: '09:20', label: '第一節' },
            { type: 'break', start: '09:20', end: '09:30', label: '下課休息' },
            { type: 'exam',  start: '09:30', end: '10:10', label: '第二節' },
            { type: 'break', start: '10:10', end: '10:30', label: '大下課' },
            { type: 'exam',  start: '10:30', end: '11:10', label: '第三節' }
        ];

        const EXAM_MESSAGES = ["考卷記得寫姓名座號", "有問題舉手問老師", "耐心細心檢查", "寫完請多檢查兩遍"];
        const BREAK_MESSAGES = ["提早去上廁所喝水", "準備下一科文具", "保持走廊安靜", "桌面淨空坐在位置上"];

        const formatTime = (date) => {
            const h = String(date.getHours()).padStart(2, '0');
            const m = String(date.getMinutes()).padStart(2, '0');
            const s = String(date.getSeconds()).padStart(2, '0');
            return `${h}:${m}:${s}`;
        };

        const App = () => {
            const [now, setNow] = useState(new Date());
            const [offset, setOffset] = useState(() => parseInt(localStorage.getItem('exam_clock_offset') || 0));
            const [isMuted, setIsMuted] = useState(false);
            const lastRung = useRef("");

            const [examData, setExamData] = useState(() => {
                const saved = localStorage.getItem('exam_data');
                return saved ? JSON.parse(saved) : { subjects: ["國語", "數學", "英文"], shouldArrive: "", actualArrive: "", absentList: "" };
            });

            const bellRef = useRef(null);

            useEffect(() => {
                const timer = setInterval(() => setNow(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            useEffect(() => {
                localStorage.setItem('exam_clock_offset', offset);
                localStorage.setItem('exam_data', JSON.stringify(examData));
            }, [offset, examData]);

            // 自動鐘聲邏輯 (在每一節開始與結束時響鈴)
            useEffect(() => {
                if (isMuted) return;
                const adjustedNow = new Date(now.getTime() + offset);
                const currentTimeStr = `${String(adjustedNow.getHours()).padStart(2, '0')}:${String(adjustedNow.getMinutes()).padStart(2, '0')}`;
                const currentSec = adjustedNow.getSeconds();

                if (currentSec === 0) { // 只在每分鐘的第 0 秒檢查
                    SCHEDULE.forEach(slot => {
                        if ((currentTimeStr === slot.start || currentTimeStr === slot.end) && lastRung.current !== currentTimeStr) {
                            playBell();
                            lastRung.current = currentTimeStr;
                        }
                    });
                }
            }, [now, offset, isMuted]);

            const playBell = () => {
                if (bellRef.current) {
                    bellRef.current.src = "https://assets.mixkit.co/active_storage/sfx/951/951-preview.mp3";
                    bellRef.current.play().catch(e => console.log("需點擊頁面以啟用音效", e));
                }
            };

            const adjustedNow = useMemo(() => new Date(now.getTime() + offset), [now, offset]);

            const currentSlot = useMemo(() => {
                const currentMs = adjustedNow.getHours() * 3600000 + adjustedNow.getMinutes() * 60000 + adjustedNow.getSeconds() * 1000;
                for (let slot of SCHEDULE) {
                    const [sh, sm] = slot.start.split(':').map(Number);
                    const [eh, em] = slot.end.split(':').map(Number);
                    const startMs = sh * 3600000 + sm * 60000;
                    const endMs = eh * 3600000 + em * 60000;
                    if (currentMs >= startMs && currentMs < endMs) return { ...slot, startMs, endMs, durationMs: endMs - startMs };
                }
                return null;
            }, [adjustedNow]);

            const progressInfo = useMemo(() => {
                if (!currentSlot) return { remainingPercent: 0, color: 'stroke-gray-300', text: '等待時段' };
                const currentMs = adjustedNow.getHours() * 3600000 + adjustedNow.getMinutes() * 60000 + adjustedNow.getSeconds() * 1000;
                const remainingMs = currentSlot.endMs - currentMs;
                const remainingPercent = Math.max(0, (remainingMs / currentSlot.durationMs) * 100);
                
                let color = 'stroke-green-500';
                if (remainingMs < 300000) color = 'stroke-red-500'; // 剩 5 分鐘變紅
                else if (remainingMs < currentSlot.durationMs / 2) color = 'stroke-yellow-400';

                return { remainingPercent, color, text: currentSlot.type === 'exam' ? `${currentSlot.label}進行中` : '休息時間' };
            }, [adjustedNow, currentSlot]);

            return (
                <div className="flex flex-col h-screen w-screen text-gray-800">
                    <audio ref={bellRef} />
                    
                    {/* 上方：時間與進度 */}
                    <div className="h-[30vh] flex bg-white border-b-4 border-gray-300 shadow-lg">
                        <div className="w-1/3 flex flex-col items-center justify-center border-r bg-gray-50 group">
                            <span className="text-xl font-bold text-gray-400">現在時間</span>
                            <div className="text-[6vw] font-black leading-none">{formatTime(adjustedNow)}</div>
                            <div className="flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity mt-2">
                                <button onClick={() => setOffset(prev => prev + 60000)} className="px-2 py-1 bg-gray-200 rounded text-xs hover:bg-gray-300">+1分</button>
                                <button onClick={() => setOffset(prev => prev - 60000)} className="px-2 py-1 bg-gray-200 rounded text-xs hover:bg-gray-300">-1分</button>
                                <button onClick={() => setIsMuted(!isMuted)} className={`px-2 py-1 rounded text-xs text-white ${isMuted ? 'bg-red-400' : 'bg-blue-400'}`}>
                                    {isMuted ? '靜音中' : '自動鈴聲開啟'}
                                </button>
                            </div>
                        </div>
                        <div className="w-2/3 relative flex flex-col items-center justify-center bg-gray-100 p-8">
                            <div className="text-[3vw] font-bold text-gray-500 mb-2">{progressInfo.text}</div>
                            <svg className="w-full h-20" viewBox="0 0 300 40">
                                <rect x="5" y="10" width="290" height="20" rx="10" fill="none" stroke="#e5e7eb" strokeWidth="8" />
                                <rect x="5" y="10" width="290" height="20" rx="10" fill="none" className={`track-transition ${progressInfo.color}`}
                                    strokeWidth="8" strokeDasharray="100" strokeDashoffset={100 - progressInfo.remainingPercent} pathLength="100" strokeLinecap="round" />
                            </svg>
                        </div>
                    </div>

                    {/* 下方：科目與提醒 */}
                    <div className="flex-1 flex">
                        <div className="w-1/2 border-r-4 border-gray-300 flex flex-col bg-white">
                            <div className="flex-1">
                                {SCHEDULE.filter(s => s.type === 'exam').map((slot, i) => (
                                    <div key={i} className={`flex items-center p-6 border-b text-[3vw] font-black ${currentSlot?.start === slot.start ? 'bg-yellow-300' : ''}`}>
                                        <input className="flex-1 bg-transparent outline-none border-b-2 border-transparent focus:border-blue-400" 
                                            value={examData.subjects[i]} 
                                            onChange={e => {
                                                const s = [...examData.subjects]; s[i] = e.target.value;
                                                setExamData({...examData, subjects: s});
                                            }} />
                                        <span className="font-mono text-gray-600 ml-4">{slot.start}-{slot.end}</span>
                                    </div>
                                ))}
                            </div>
                            <div className="h-[25%] bg-blue-50 flex">
                                <div className="flex-1 p-4 border-r border-blue-200 flex flex-col items-center">
                                    <span className="text-lg font-bold text-blue-800">應到人數</span>
                                    <input className="w-full text-5xl font-black bg-transparent text-center outline-none" value={examData.shouldArrive} onChange={e => setExamData({...examData, shouldArrive: e.target.value})} placeholder="0" />
                                </div>
                                <div className="flex-1 p-4 flex flex-col items-center">
                                    <span className="text-lg font-bold text-red-800">未到座號/姓名</span>
                                    <textarea className="w-full h-full bg-transparent text-center text-2xl font-bold text-red-600 outline-none resize-none" value={examData.absentList} onChange={e => setExamData({...examData, absentList: e.target.value})} placeholder="點擊輸入" />
                                </div>
                            </div>
                        </div>
                        <div className="w-1/2 bg-[#fffdf0] flex flex-col">
                            <div className="bg-yellow-400 text-yellow-900 px-6 py-2 text-2xl font-bold">📢 提醒事項</div>
                            <div className="flex-1 flex items-center justify-center p-12 text-[4.5vw] font-bold text-center leading-snug">
                                {currentSlot?.type === 'exam' 
                                    ? EXAM_MESSAGES[Math.floor(now.getSeconds()/10)%EXAM_MESSAGES.length] 
                                    : (currentSlot ? BREAK_MESSAGES[Math.floor(now.getSeconds()/10)%BREAK_MESSAGES.length] : "準備考試，請保持安靜")}
                            </div>
                            <div className="h-4 bg-stripes"></div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
